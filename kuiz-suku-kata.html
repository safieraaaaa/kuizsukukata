<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuiz Suku Kata</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#fdf1dc;--yellow:#fdbf33;--red:#c8321e;--blue:#1f65b8;--orange:#ffa726;--orange-d:#e07a1f;--tile-text:#fff;--pink:#f7e3e3;--sand:#f5e1bc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-family:'Quicksand',system-ui,sans-serif;color:#3a2a20;overflow-x:hidden;
background:var(--cream) url('image/background.jpg') center/cover fixed no-repeat}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;position:relative}
.card{position:relative;z-index:1;width:min(780px,100%);background:#fff;border-radius:48px;padding:28px 28px 90px;
box-shadow:10px 10px 0 var(--yellow),14px 14px 0 rgba(200,50,30,.35)}
.title{font-family:'Lilita One',Impact,sans-serif;color:var(--red);background:var(--pink);border-radius:999px;text-align:center;
font-size:clamp(20px,4vw,34px);padding:12px 20px;margin:46px auto 22px;max-width:620px;text-transform:uppercase;letter-spacing:.02em}
.hud{position:absolute;top:14px;right:18px;display:flex;gap:10px}
.hud button,.hud div{font-family:'Lilita One',sans-serif;font-size:22px;color:#3a2a20;background:var(--cream);border:5px solid #4a2f22;border-radius:14px;padding:6px 16px;min-width:64px;cursor:pointer}
.hud div{cursor:default}
.play{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap}
.pic{width:min(260px,70vw);aspect-ratio:1;background:#fff8ea;border:12px solid #dd7219;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:clamp(90px,18vw,140px);line-height:1}
.pic img{max-width:100%;max-height:100%;object-fit:contain}
.right{display:flex;flex-direction:column;gap:34px;align-items:center}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.slot{width:98px;height:84px;border:3px dashed var(--red);border-radius:14px;background:var(--sand);display:flex;align-items:center;justify-content:center;
font-family:'Lilita One',sans-serif;font-size:56px;color:var(--yellow);-webkit-text-stroke:2px #3a2a20;transition:background .2s}
.slot.over{background:#ffe9a8}
.slot .tile{width:100%;height:100%;border-radius:11px;-webkit-text-stroke:0}
.tile{width:98px;height:84px;background:var(--orange);border:3px solid var(--orange-d);color:var(--tile-text);font-family:'Quicksand',sans-serif;font-weight:700;font-size:28px;
display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;text-transform:uppercase}
.tile.used{visibility:hidden}
.tile.c0{background:#ef5350;border-color:#c62828}
.tile.c1{background:#42a5f5;border-color:#1565c0}
.tile.c2{background:#ab47bc;border-color:#7b1fa2}
.tile.c3{background:#ffa726;border-color:#e07a1f}
.ghost{position:fixed;z-index:99;pointer-events:none;opacity:.92;transform:rotate(-4deg) scale(1.06);box-shadow:0 8px 18px rgba(0,0,0,.25)}
.ok .slot{background:#c9f0c8;border-color:#2e9b3a}
.ok .slot .tile{background:#3bb54a;border-color:#2e9b3a}
.bad .slot{animation:shake .45s}
.bad .slot .tile{background:#e2503a;border-color:var(--red)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.msg{height:28px;text-align:center;font-family:'Lilita One',sans-serif;font-size:22px;margin-top:14px;color:var(--blue)}
.next,.big{font-family:'Lilita One',sans-serif;color:var(--red);background:var(--pink);border:0;border-radius:999px;cursor:pointer;text-transform:uppercase}
.next{position:absolute;right:22px;bottom:22px;font-size:24px;padding:14px 32px;transition:opacity .2s}
.next{color:#1f65b8;background:#dbeafe}
.next:disabled{opacity:.35;cursor:not-allowed}
.panel{text-align:center;padding:30px 10px}
.logo{font-family:'Lilita One',sans-serif;color:#F47321;font-size:clamp(54px,12vw,108px);line-height:1;-webkit-text-stroke:0;text-shadow:-5px -5px 0 #fff,5px -5px 0 #fff,-5px 5px 0 #fff,5px 5px 0 #fff,0 0 0 #fff;margin:0;paint-order:stroke fill}
.hero{background:#FFF2B4;border-radius:36px;padding:36px 20px 44px;border:6px solid var(--red);margin:10px 0}
.big{background:var(--blue);color:#fff;font-size:26px;padding:12px 36px;margin-top:18px}
.pill{display:inline-block;background:#2e9b3a;color:#fff;font-size:22px;padding:10px 34px;border-radius:999px;margin:20px 0 14px}
.score{font-family:'Lilita One',sans-serif;color:#2e9b3a;font-size:30px;margin:10px 0}
.congrats{font-family:'Lilita One',sans-serif;color:var(--blue);font-size:clamp(48px,10vw,84px);margin:10px 0}
.hide{display:none}
@media(max-width:640px){.slot,.tile{width:74px;height:68px;font-size:22px}.card{border-radius:32px;padding:20px 16px 90px}.right{gap:22px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="stage"><div class="card" id="card">

<section id="home" class="panel">
  <div class="hero"><h1 class="logo">KUIZ<br>SUKU KATA</h1><button class="big" id="start">Main</button></div>
</section>

<section id="game" class="hide">
  <div class="hud"><button id="snd" aria-label="Dengar perkataan">🔊</button><div id="count">1/10</div></div>
  <div class="title">Tarik suku kata ke atas</div>
  <div class="play">
    <div class="pic" id="pic"></div>
    <div class="right">
      <div class="row" id="slots"></div>
      <div class="row" id="tray"></div>
    </div>
  </div>
  <div class="msg" id="msg"></div>
  <button class="next" id="next" disabled>Seterusnya</button>
</section>

<section id="end" class="panel hide">
  <div class="congrats">TAHNIAH!</div>
  <div class="pill">ANDA TERBAIK</div>
  <div class="score" id="score"></div>
  <div style="color:#2e9b3a;font-size:22px">Syabas semua! Teruskan belajar!</div>
  <button class="big" id="again">Main lagi</button>
</section>

</div></div>
<script>
const WORDS=[
{w:'kaki',s:['ka','ki'],e:'image/kaki-removebg-preview.png',d:['ke','kan']},
{w:'buku',s:['bu','ku'],e:'image/buku-removebg-preview.png',d:['bun','la']},
{w:'baju',s:['ba','ju'],e:'image/baju-removebg-preview.png',d:['bi','ji']},
{w:'mata',s:['ma','ta'],e:'image/mata-removebg-preview.png',d:['bi','la']},
{w:'kasut',s:['ka','sut'],e:'image/kasut-removebg-preview.png',d:['su','tuk']},
{w:'batu',s:['ba','tu'],e:'image/batu-removebg-preview.png',d:['ta','bu']},
{w:'bola',s:['bo','la'],e:'image/bola-removebg-preview.png',d:['lo','bal']},
{w:'sabun',s:['sa','bun'],e:'image/sabun-removebg-preview.png',d:['su','bu']},
{w:'pisang',s:['pi','sang'],e:'image/pisang-removebg-preview.png',d:['pa','sa']},
{w:'roti',s:['ro','ti'],e:'image/roti-removebg-preview.png',d:['ta','se']}];
const $=id=>document.getElementById(id);
let order,idx,score,slots,tiles,tries,done;
const show=id=>['home','game','end'].forEach(x=>$(x).classList.toggle('hide',x!==id));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function start(){order=shuf(WORDS);idx=0;score=0;show('game');load()}
function load(){
  const q=order[idx];done=false;tries=0;slots=[null,null];
  $('count').textContent=(idx+1)+'/10';$('pic').innerHTML=/\.(png|jpe?g|webp|svg|gif)$/i.test(q.e)?'<img src="'+q.e+'" alt="'+q.w+'">':q.e;$('msg').textContent='';
  $('next').disabled=true;$('next').textContent=idx===9?'Selesai':'Seterusnya';
  $('card').classList.remove('ok','bad');
  tiles=shuf([...q.s,...q.d]).map((t,i)=>({id:i,t}));
  render();
}
function render(){
  const sl=$('slots'),tr=$('tray');sl.innerHTML='';tr.innerHTML='';
  slots.forEach((id,i)=>{
    const d=document.createElement('div');d.className='slot';d.dataset.i=i;
    if(id===null)d.textContent='?';
    else{const t=tiles[id];const e=mk(t);e.onclick=()=>{if(done)return;slots[i]=null;render()};d.appendChild(e)}
    sl.appendChild(d)});
  tiles.forEach(t=>{const e=mk(t);if(slots.includes(t.id))e.classList.add('used');tr.appendChild(e)});
}
function mk(t){const e=document.createElement('div');e.className='tile c'+(t.id%4);e.textContent=t.t;e.dataset.id=t.id;e.addEventListener('pointerdown',ev=>drag(ev,t,e));return e}

function drag(ev,t,el){
  if(done||el.classList.contains('used')||el.parentElement.classList.contains('slot'))return;
  ev.preventDefault();
  const r=el.getBoundingClientRect(),ox=ev.clientX-r.left,oy=ev.clientY-r.top,sx=ev.clientX,sy=ev.clientY;
  let g=null,moved=false;
  const mv=e=>{
    if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)>8){moved=true;g=el.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';g.style.height=r.height+'px';document.body.appendChild(g)}
    if(g){g.style.left=(e.clientX-ox)+'px';g.style.top=(e.clientY-oy)+'px';
      document.querySelectorAll('.slot').forEach(s=>{const b=s.getBoundingClientRect();s.classList.toggle('over',e.clientX>b.left&&e.clientX<b.right&&e.clientY>b.top&&e.clientY<b.bottom)})}};
  const up=e=>{
    window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
    document.querySelectorAll('.slot').forEach(s=>s.classList.remove('over'));
    let target=-1;
    if(!moved)target=slots.indexOf(null);
    else{g.remove();document.querySelectorAll('.slot').forEach(s=>{const b=s.getBoundingClientRect();
      if(e.clientX>b.left&&e.clientX<b.right&&e.clientY>b.top&&e.clientY<b.bottom)target=+s.dataset.i})}
    if(target>-1){slots[target]=t.id;render();check()}
  };
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
}
function check(){
  if(slots.includes(null)||slots.some(s=>s===undefined))return;
  const q=order[idx],ans=slots.map(i=>tiles[i].t).join('');
  if(ans===q.s.join('')){
    done=true;if(tries===0)score++;
    $('card').classList.add('ok');$('msg').textContent='Betul! '+q.w.toUpperCase();$('next').disabled=false;speak(q.w);
  }else{
    tries++;done=true;$('card').classList.add('bad');$('msg').textContent='Cuba lagi!';
    setTimeout(()=>{slots=[null,null];done=false;$('card').classList.remove('bad');$('msg').textContent='';render()},800);
  }
}
try{speechSynthesis.getVoices()}catch(e){}
function pickVoice(){const v=speechSynthesis.getVoices();return v.find(x=>/^ms[-_]/i.test(x.lang))||v.find(x=>/^id[-_]/i.test(x.lang))||null}
function speak(w){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='ms-MY';const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
$('snd').onclick=()=>speak(order[idx].w);
$('next').onclick=()=>{if(idx<9){idx++;load()}else{$('score').textContent='Skor: '+score+' / 10';show('end')}};
$('start').onclick=start;$('again').onclick=start;
</script>
</body>
</html>
